<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公開してみよう。 - AI開発 公開アシスタント</title>
  <meta name="description" content="AIを使って作ったソフトウェアをGitHubやGitHub Pagesで公開するための初心者向けステップガイド。">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-badge">
        <span>🚀</span>
        <span>AI開発 公開アシスタント</span>
      </div>
      <h1 class="app-title">公開してみよう。</h1>
      <p class="app-subtitle">せっかく作ったなら、世界に届けてみよう。</p>
    </header>

    <!-- Progress Section -->
    <section class="progress-section" id="progress-section" style="display: none;">
      <div class="progress-header">
        <span id="progress-step-label">ステップ 1 / 8</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </section>

    <!-- Dynamic Step Content Area -->
    <main id="step-container">
      <!-- JavaScript will render step card here -->
    </main>

    <!-- Footer -->
    <footer style="margin-top: 32px; text-align: center; font-size: 0.8rem; color: var(--text-dim);">
      <p>公開してみよう。ツール &copy; 2026 MIT License</p>
      <p style="margin-top: 6px;">
        入力内容はこのブラウザ内（localStorage）に自動保存され、外部へは送信されません。
      </p>
      <p style="margin-top: 6px;">
        <button type="button" id="btn-global-reset" style="background: none; border: none; color: var(--text-dim); text-decoration: underline; cursor: pointer; font-size: 0.8rem;">
          最初からやり直す（リセット）
        </button>
        <span style="margin-left: 4px;">で保存内容を消去できます。</span>
      </p>
    </footer>
  </div>

  <!-- Reset Confirmation Dialog -->
  <div id="reset-dialog-backdrop" class="modal-backdrop" hidden>
    <div id="reset-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-desc" tabindex="-1">
      <h2 id="reset-dialog-title" class="modal-title">入力内容と進捗をリセット</h2>
      <p id="reset-dialog-desc" class="modal-desc">
        このブラウザに保存されている入力内容とチェック状態をすべて消去し、最初の画面へ戻りますか？
      </p>
      <div class="modal-actions">
        <button type="button" id="btn-reset-cancel" class="btn btn-secondary">キャンセル</button>
        <button type="button" id="btn-reset-confirm" class="btn btn-danger">リセットする</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
